name: Benchmark measurement contracts

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  measurement-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install evaluator dependencies
        run: python -m pip install requests==2.34.2 httpx==0.28.1 pycryptodome==3.23.0 coincurve==21.0.0
      - name: Verify measurement, review, corpus, and resource contracts
        run: |
          python -m unittest discover -s scripts/benches
          python -m unittest scripts.tests.test_curated_resource_contact_model_eval scripts.tests.test_natural_conversation_benchmark scripts.tests.test_natural_corpus_lifecycle
      # Provider-backed cohorts are explicit local operations, never secret-bearing PR jobs.
